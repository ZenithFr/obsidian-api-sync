<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Obsidian Web — Vault</title>

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">

  <!-- Tailwind CSS Play CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="/static/js/tailwind-config.js"></script>

  <!-- DOMPurify — XSS sanitization (code-security/rules/xss.md) -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/dompurify/3.1.6/purify.min.js"></script>

  <!-- Marked.js — Markdown parser -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/marked/12.0.0/marked.min.js"></script>

  <!-- KaTeX — LaTeX math rendering -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/katex.min.css" />
  <script src="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/katex.min.js"></script>

  <!-- highlight.js — Syntax highlighting for code blocks -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/github-dark.min.css" />
  <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>

  <style>
    /* ── Scrollbars ─────────────────────────────────────────────── */
    ::-webkit-scrollbar { width: 4px; height: 4px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: #404040; border-radius: 9999px; }
    ::-webkit-scrollbar-thumb:hover { background: #a78bfa55; }

    /* ── Animations ─────────────────────────────────────────────── */
    @keyframes fadeIn   { from { opacity:0 } to { opacity:1 } }
    @keyframes slideIn  { from { opacity:0; transform:translateY(6px) } to { opacity:1; transform:translateY(0) } }
    @keyframes shimmer  { 0%{background-position:200% 0} 100%{background-position:-200% 0} }
    @keyframes spin     { to { transform: rotate(360deg) } }

    .animate-fadeIn  { animation: fadeIn  0.25s ease both; }
    .animate-slideIn { animation: slideIn 0.3s cubic-bezier(.4,0,.2,1) both; }
    .animate-spin    { animation: spin 0.8s linear infinite; }

    /* ── Layout ─────────────────────────────────────────────────── */
    html, body { height:100%; overflow:hidden; background-color:#1f1f1f; color:#eeeeee; scrollbar-color:#404040 #141414; scrollbar-width:thin; }
    #app-root   { display:flex; flex-direction:column; height:100vh; overflow:hidden; background-color:#1f1f1f; }
    #main-area  { display:flex; flex:1; overflow:hidden; min-height:0; background-color:#1f1f1f; }

    /* ── Sidebar ─────────────────────────────────────────────────── */
    #sidebar {
      display:flex; flex-direction:column;
      width:260px; min-width:200px; max-width:380px;
      background: #262626;
      border-right: 1px solid #404040;
      transition: width 0.2s ease;
      user-select: none;
    }
    #sidebar.collapsed { width:0; min-width:0; overflow:hidden; }

    /* Resizer handle */
    #resizer {
      width:4px; cursor:col-resize; background:transparent;
      flex-shrink:0; transition:background 0.15s;
    }
    #resizer:hover, #resizer.dragging { background: #a78bfa44; }

    /* ── File Tree ───────────────────────────────────────────────── */
    .tree-item {
      display:flex; align-items:center;
      padding: 4px 8px; border-radius: 6px; cursor:pointer;
      font-size:16px; gap:5px; white-space:nowrap; overflow:hidden;
      transition: background 0.1s;
      position:relative;
    }
    .tree-item:hover { background: rgba(255,255,255,0.04); }
    .tree-item.active { background: rgba(167,139,250,0.12); color: #a78bfa; }
    .tree-item:focus-visible { outline: none; box-shadow: 0 0 0 2px rgba(167,139,250,0.4); }
    .tree-item .item-label { overflow:hidden; text-overflow:ellipsis; flex:1; }
    .tree-item .item-actions {
      display:none; gap:3px; flex-shrink:0;
    }
    .tree-item:hover .item-actions { display:flex; }
    .tree-item .action-btn {
      padding:2px 4px; border-radius:3px; opacity:0.5; transition:opacity .1s;
      background:transparent; border:none; cursor:pointer; color:inherit;
      font-size:11px; line-height:1;
    }
    .tree-item .action-btn:hover { opacity:1; background:rgba(255,255,255,0.08); }

    .tree-folder > .tree-children {
      padding-left: 14px;
      border-left: 1px solid #404040;
      margin-left: 9px;
    }
    .tree-folder.collapsed > .tree-children { display:none; }

    /* ── Editor / Reader Pane ─────────────────────────────────────── */
    #content-area {
      flex:1; display:flex; flex-direction:column; min-width:0; overflow:hidden;
      background:#1f1f1f;
    }
    #editor-toolbar {
      display:flex; align-items:center; gap:8px;
      padding: 8px 16px; border-bottom:1px solid #404040;
      background:#1f1f1f; flex-shrink:0;
      min-height:52px; flex-wrap:wrap;
    }
    #reading-container, #welcome-state {
      background:#1f1f1f;
    }
    #reader-pane {
      flex:1; overflow-y:auto; padding:16px 24px;
      max-width:100%; width:100%;
      margin:0;
      background: #1f1f1f;
      animation: fadeIn 0.2s ease;
    }
    #editor-pane {
      flex:1; display:flex; flex-direction:column; overflow:hidden;
      background:#1f1f1f;
    }
    #editor-textarea {
      flex:1; resize:none; outline:none; border:none;
      background:#1f1f1f; color:#eeeeee;
      font-family: 'JetBrains Mono', monospace;
      font-size:16px; line-height:1.7;
      padding:16px 24px;
      tab-size:2;
    }
    #editor-statusbar {
      display:flex; align-items:center; gap:12px;
      padding:4px 16px; background:#262626;
      border-top:1px solid #404040;
      font-size:11px; color:#dadada;
      flex-shrink:0;
    }

    /* ── Markdown Prose Styles ───────────────────────────────────── */
    #reader-pane h1 { font-size:36px; font-weight:400; margin:0 0 0.4em; line-height:1.11; color:#eeeeee; }
    #reader-pane h2 { font-size:24px; font-weight:400; margin:1em 0 0.4em; color:#eeeeee; border-bottom:1px solid #404040; padding-bottom:0.3em; line-height:1.11; }
    #reader-pane h3 { font-size:20px; font-weight:500; margin:0.8em 0 0.3em; color:#eeeeee; line-height:1.2; }
    #reader-pane h4 { font-size:16px; font-weight:500; margin:0.6em 0 0.2em; color:#dadada; }
    #reader-pane p  { margin:0 0 0.6em; font-size:16px; font-weight:500; line-height:1.25; color:#eeeeee; }
    #reader-pane ul,
    #reader-pane ol { margin:0 0 0.6em; padding-left:1.6em; font-size:16px; font-weight:500; line-height:1.25; color:#eeeeee; }
    #reader-pane li { margin-bottom:0.2em; }
    #reader-pane a  { color:#a78bfa; text-decoration:none; }
    #reader-pane a:hover { text-decoration:underline; color:#c4b5fd; }
    #reader-pane blockquote {
      border-left:3px solid #a78bfa44; margin:0.6em 0;
      padding:0.4em 0.8em; color:#dadada;
      background: rgba(167,139,250,0.04); border-radius:0 4px 4px 0;
    }
    #reader-pane hr { border:none; border-top:1px solid #404040; margin:1em 0; }
    #reader-pane img { max-width:100%; border-radius:6px; }
    #reader-pane table { width:100%; border-collapse:collapse; margin:0.6em 0; font-size:0.9em; }
    #reader-pane th { background:#262626; color:#eeeeee; font-weight:600; padding:8px 12px; text-align:left; border:1px solid #404040; }
    #reader-pane td { padding:8px 12px; border:1px solid #404040; color:#dadada; }
    #reader-pane tr:nth-child(even) td { background:rgba(255,255,255,0.02); }

    /* Code & YAML blocks */
    #reader-pane code {
      background:#262626; color:#a78bfa;
      font-family:ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", monospace;
      font-size:0.85em; padding:2px 6px; border-radius:4px; border:1px solid #333333;
    }
    #reader-pane pre {
      background:#141414; border:1px solid #333333;
      border-radius: 8px; overflow-x:auto;
      margin:0.8em 0; padding:0;
    }
    #reader-pane pre code {
      background:transparent; color:#e4e4e7;
      padding:14px 18px; font-size:13px; line-height:1.45;
      font-family:ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", monospace;
      display:block; tab-size:2; white-space:pre;
    }

    /* Task checkboxes */
    #reader-pane input[type="checkbox"] {
      accent-color:#a78bfa; margin-right:6px;
      cursor:pointer;
    }

    /* Wikilinks */
    #reader-pane a.wikilink {
      color:#a78bfa; text-decoration:none;
      border-bottom:1px dashed #a78bfa55;
      cursor:pointer;
    }
    #reader-pane a.wikilink:hover { color:#c4b5fd; border-bottom-color:#c4b5fd; }

    /* Highlights */
    #reader-pane mark {
      background: rgba(253, 224, 71, 0.25);
      color: #fef08a;
      padding: 1px 4px;
      border-radius: 3px;
    }

    /* ── Callouts ─────────────────────────────────────────────────── */
    .callout {
      border-radius: 6px; margin: 12px 0; padding: 0;
      border: 1px solid; overflow: hidden;
      box-shadow: var(--tw-shadow-card);
    }
    .callout-title {
      display:flex; align-items:center; gap:8px;
      padding: 10px 14px; font-weight:600; font-size:15px;
    }
    summary.callout-title { cursor: pointer; user-select: none; }
    summary.callout-title::-webkit-details-marker { display: none; }
    .callout-body { padding:10px 14px; font-size:15px; line-height:1.6; }
    .callout-icon { font-size:16px; flex-shrink:0; }

    .callout[data-type="note"], .callout[data-type="info"] { background:rgba(96,165,250,0.06); border-color:rgba(96,165,250,0.25); }
    .callout[data-type="note"] .callout-title, .callout[data-type="info"] .callout-title { color:#60a5fa; background:rgba(96,165,250,0.08); }

    .callout[data-type="tip"], .callout[data-type="hint"] { background:rgba(52,211,153,0.06); border-color:rgba(52,211,153,0.25); }
    .callout[data-type="tip"] .callout-title, .callout[data-type="hint"] .callout-title { color:#34d399; background:rgba(52,211,153,0.08); }

    .callout[data-type="important"], .callout[data-type="todo"] { background:rgba(167,139,250,0.06); border-color:rgba(167,139,250,0.25); }
    .callout[data-type="important"] .callout-title, .callout[data-type="todo"] .callout-title { color:#a78bfa; background:rgba(167,139,250,0.08); }

    .callout[data-type="warning"], .callout[data-type="attention"] { background:rgba(245,158,11,0.06); border-color:rgba(245,158,11,0.25); }
    .callout[data-type="warning"] .callout-title, .callout[data-type="attention"] .callout-title { color:#f59e0b; background:rgba(245,158,11,0.08); }

    .callout[data-type="caution"], .callout[data-type="danger"], .callout[data-type="bug"] { background:rgba(239,68,68,0.06); border-color:rgba(239,68,68,0.25); }
    .callout[data-type="caution"] .callout-title, .callout[data-type="danger"] .callout-title, .callout[data-type="bug"] .callout-title { color:#ef4444; background:rgba(239,68,68,0.08); }

    .callout[data-type="success"], .callout[data-type="done"] { background:rgba(34,197,94,0.06); border-color:rgba(34,197,94,0.25); }
    .callout[data-type="success"] .callout-title, .callout[data-type="done"] .callout-title { color:#22c55e; background:rgba(34,197,94,0.08); }

    .callout[data-type="question"], .callout[data-type="help"], .callout[data-type="faq"] { background:rgba(251,146,60,0.06); border-color:rgba(251,146,60,0.25); }
    .callout[data-type="question"] .callout-title, .callout[data-type="help"] .callout-title, .callout[data-type="faq"] .callout-title { color:#fb923c; background:rgba(251,146,60,0.08); }

    .callout[data-type="example"], .callout[data-type="quote"] { background:rgba(148,163,184,0.06); border-color:rgba(148,163,184,0.25); }
    .callout[data-type="example"] .callout-title, .callout[data-type="quote"] .callout-title { color:#94a3b8; background:rgba(148,163,184,0.08); }

    /* ── Modals ───────────────────────────────────────────────────── */
    .modal-backdrop {
      position:fixed; inset:0; background:rgba(0,0,0,0.6);
      display:flex; align-items:center; justify-content:center;
      z-index:100; animation: fadeIn 0.15s ease;
      backdrop-filter: blur(4px);
    }
    .modal-box {
      box-shadow: var(--tw-shadow-elevated);
      background: #262626; border: 1px solid #404040;
      border-radius: 12px; padding: 24px; min-width: 340px; max-width: 480px; width: 90%;
      animation: slideIn 0.2s ease;
    }

    /* ── Toast ────────────────────────────────────────────────────── */
    #toast-root { position:fixed; bottom:20px; right:20px; z-index:200; display:flex; flex-direction:column; gap:8px; align-items:flex-end; pointer-events:none; }
    .toast {
      background:#262626; border:1px solid #404040;
      border-radius: 12px; padding:10px 16px;
      font-size:16px; color:#eeeeee;
      display:flex; align-items:center; gap:8px;
      box-shadow: var(--tw-shadow-elevated);
      animation: slideIn 0.25s ease;
      pointer-events:none;
      max-width:340px;
    }
    .toast.error { border-color:#ef444440; color:#f87171; }
    .toast.success { border-color:#22c55e40; }

    /* ── Utility Buttons ──────────────────────────────────────────── */
    .btn {
      box-shadow: var(--tw-shadow-card);
      border-radius: 6px;
      transition: all 100ms cubic-bezier(0.4, 0, 0.2, 1);
      display:inline-flex; align-items:center; gap:6px; font-size:16px; font-weight:500; padding:8px 16px; cursor:pointer; border:1px solid transparent; 
    }
    .btn:active { transform:scale(0.97); }
    .btn-primary { background:#7c3aed; color:#fff; border-color:#7c3aed; }
    .btn-primary:hover { background:#a78bfa; border-color:#a78bfa; }
    .btn-ghost { background:transparent; color:#dadada; border-color:#404040; box-shadow: none; }
    .btn-ghost:hover { background:#404040; color:#eeeeee; border-color:#404040; }
    .btn-ghost.active-mode { background:#262626; color:#a78bfa; border-color:#a78bfa33; }
    .btn-danger { background:transparent; color:#ef4444; border-color:#404040; box-shadow: none; }
    .btn-danger:hover { background:#ef444418; border-color:#ef444440; }
    .input {
      background:#1f1f1f; border:1px solid #404040; color:#eeeeee;
      border-radius: 6px; padding:8px 12px; font-size:16px; outline:none;
      transition:border-color .15s;
    }
    .input:focus { border-color:#a78bfa66; box-shadow:0 0 0 3px rgba(167,139,250,0.08); }
    .input::placeholder { color:#555; }

    /* ── Empty / Loading States ───────────────────────────────────── */
    .empty-state { display:flex; flex-direction:column; align-items:center; justify-content:center; gap:12px; color:#dadada; flex:1; text-align:center; padding:40px; }
    .empty-state svg { opacity:0.3; }
  </style>
</head>

<body class="bg-background text-text font-sans antialiased">
<div id="app-root">

  <!-- ── Top Header ────────────────────────────────────────────── -->
  <header style="background:rgba(31,31,31,0.9); backdrop-filter:blur(12px); border-bottom:1px solid #404040; z-index:40;"
          class="flex items-center gap-3 px-4 h-12 flex-shrink-0">
    <!-- Sidebar toggle -->
    <button id="sidebar-toggle" title="Toggle Sidebar" aria-label="Toggle Sidebar"
            class="btn btn-ghost !p-1.5 !border-transparent">
      <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"/></svg>
    </button>

    <!-- Logo + vault name -->
    <div class="flex items-center gap-2.5">
      <img src="/static/assets/icon.png" alt="" class="w-5 h-5 rounded opacity-90">
      <span class="text-sm font-semibold text-text">Obsidian Web</span>
      <span class="text-xs text-muted hidden sm:inline" id="vault-label"></span>
    </div>

    <div class="flex-1 min-w-0"></div>

    <!-- File title in header -->
    <span id="header-file-title" class="text-sm text-muted truncate max-w-[260px] hidden sm:block"></span>

    <div class="flex items-center gap-2">
      <!-- WS status -->
      <div class="flex items-center gap-1.5" id="ws-status-indicator" title="Real-time sync">
        <span class="w-2 h-2 rounded-full bg-muted/30" id="ws-dot"></span>
        <span class="text-xs text-muted hidden md:inline" id="ws-label">Offline</span>
      </div>
      <div class="w-px h-4 bg-border mx-1"></div>
      <!-- Dashboard link -->
      <a href="/dashboard" class="btn btn-ghost !text-xs">
        <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6"/></svg>
        Dashboard
      </a>
    </div>
  </header>

  <!-- ── Main Area ─────────────────────────────────────────────── -->
  <div id="main-area">

    <!-- ─── Sidebar ───────────────────────────────────────────── -->
    <aside id="sidebar">
      <!-- Search -->
      <div class="p-2 border-b border-border flex-shrink-0">
        <label for="tree-search" class="sr-only">Search files</label>
        <input id="tree-search" type="text" placeholder="Search files…" aria-label="Search files" class="input w-full !py-1.5 !text-xs" />
      </div>

      <!-- Tree actions -->
      <div class="px-2 py-1.5 flex items-center gap-1 border-b border-border flex-shrink-0">
        <span class="text-xs text-muted font-medium flex-1 pl-1 uppercase tracking-wider">Vault</span>
        <button id="btn-new-note" title="New note" aria-label="New note" class="btn btn-ghost !p-1.5 !border-transparent">
          <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"/></svg>
        </button>
        <button id="btn-new-folder" title="New folder" aria-label="New folder" class="btn btn-ghost !p-1.5 !border-transparent">
          <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 13h6m-3-3v6m-9 1V7a2 2 0 012-2h6l2 2h6a2 2 0 012 2v8a2 2 0 01-2 2H5a2 2 0 01-2-2z"/></svg>
        </button>
        <button id="btn-refresh-tree" title="Refresh tree" aria-label="Refresh tree" class="btn btn-ghost !p-1.5 !border-transparent">
          <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"/></svg>
        </button>
      </div>

      <!-- File tree -->
      <div id="file-tree" class="flex-1 overflow-y-auto p-1.5">
        <div class="empty-state !py-8">
          <svg class="w-8 h-8 animate-spin" fill="none" viewBox="0 0 24 24"><circle class="opacity-25" cx="12" cy="12" r="10" stroke="#a78bfa" stroke-width="4"/><path class="opacity-75" fill="#a78bfa" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4z"/></svg>
          <span class="text-xs">Loading vault…</span>
        </div>
      </div>
    </aside>

    <!-- Drag resizer -->
    <div id="resizer"></div>

    <!-- ─── Content Area ─────────────────────────────────────── -->
    <div id="content-area" class="bg-background">

      <!-- Editor toolbar -->
      <div id="editor-toolbar">
        <div id="mode-switcher" class="flex items-center gap-1.5">
          <button id="btn-reading" aria-label="Reading mode" class="btn btn-ghost active-mode">
            <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"/></svg>
            Reading
          </button>
          <button id="btn-editing" aria-label="Editing mode" class="btn btn-ghost">
            <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M11 5H6a2 2 0 00-2 2v11a2 2 0 002 2h11a2 2 0 002-2v-5m-1.414-9.414a2 2 0 112.828 2.828L11.828 15H9v-2.828l8.586-8.586z"/></svg>
            Edit
          </button>
        </div>

        <div class="flex-1"></div>

        <!-- File actions (hidden when no file is open) -->
        <div id="file-actions" class="hidden flex items-center gap-2">
          <span id="save-status" class="text-xs text-muted/70 transition-opacity"></span>
          <button id="btn-save" aria-label="Save file" class="btn btn-primary hidden">
            <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 7H5a2 2 0 00-2 2v9a2 2 0 002 2h14a2 2 0 002-2V9a2 2 0 00-2-2h-3m-1 4l-3 3m0 0l-3-3m3 3V4"/></svg>
            Save
          </button>
        </div>
      </div>

      <!-- Reading pane (default visible) -->
      <div id="reading-container" class="flex-1 overflow-y-auto flex flex-col bg-background" style="min-height:0">
        <div id="reader-pane" class="hidden">
          <!-- Markdown rendered here by renderMarkdown() -->
        </div>
        <!-- Welcome / empty state -->
        <div id="welcome-state" class="empty-state flex-1 bg-background">
          <svg class="w-14 h-14" viewBox="0 0 24 24" fill="none" stroke="#a78bfa" stroke-width="1.5"><path stroke-linecap="round" stroke-linejoin="round" d="M12 6.042A8.967 8.967 0 006 3.75c-1.052 0-2.062.18-3 .512v14.25A8.987 8.987 0 016 18c2.305 0 4.408.867 6 2.292m0-14.25a8.966 8.966 0 016-2.292c1.052 0 2.062.18 3 .512v14.25A8.987 8.987 0 0018 18a8.967 8.967 0 00-6 2.292m0-14.25v14.25"/></svg>
          <h2 class="text-base font-semibold text-text/60">Select a note</h2>
          <p class="text-sm text-muted max-w-xs">Choose a file from the sidebar to start reading, or create a new note.</p>
        </div>
      </div>

      <!-- Editor pane (hidden by default) -->
      <div id="editor-container" class="flex-1 hidden flex-col" style="min-height:0; position: relative;">
        <textarea id="editor-textarea" class="flex-1"></textarea>
        <div id="editor-statusbar">
          <span id="stat-words">0 words</span>
          <span id="stat-chars">0 chars</span>
          <span id="stat-lines">0 lines</span>
          <span class="flex-1"></span>
          <span>Markdown</span>
        </div>
      </div>
    </div>
  </div>
</div>
